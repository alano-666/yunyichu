<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="云衣橱"/>
<meta name="theme-color" content="#a1c4fd"/>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 36 36'><text y='32' font-size='32'>🌤️</text></svg>"/>
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><rect width='180' height='180' rx='36' fill='%23a1c4fd'/><text x='90' y='130' font-size='100' text-anchor='middle'>🌤️</text></svg>"/>
<link rel="manifest" href="./manifest.json"/>
<title>云衣橱</title>

<style>
/* ==========================================================
   云衣橱 PWA — 主题、布局、组件样式
   ========================================================== */

/* ---- 三套治愈系主题 ---- */
:root,[data-theme="sky"]{
  --bg1:#eaf6ff;--bg2:#f5fbff;--pri:#7cc4ec;--prid:#5aa9d6;--ac:#a8d8ea;
  --ga:#a1c4fd;--gb:#c2e9fb;--card:#fff;--tx:#2d4a5e;--txs:#6f93a8;
  --ln:#e3eef6;--sh:rgba(124,196,236,.22);
}
[data-theme="mint"]{
  --bg1:#e6f7f4;--bg2:#f4fcfa;--pri:#7fd1c4;--prid:#5cb8a9;--ac:#b3e6dd;
  --ga:#a8edea;--gb:#cdeff0;--card:#fff;--tx:#2c4f49;--txs:#6f9a93;
  --ln:#e0f1ee;--sh:rgba(127,209,196,.22);
}
[data-theme="lavender"]{
  --bg1:#efecfb;--bg2:#f7f5fe;--pri:#a99ce6;--prid:#8b7bd6;--ac:#c9bff0;
  --ga:#c2b8f5;--gb:#dcd6f7;--card:#fff;--tx:#3d3760;--txs:#847caa;
  --ln:#ece8f7;--sh:rgba(169,156,230,.22);
}

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  background:#d8e9f5;color:var(--tx);
  display:flex;justify-content:center;align-items:center;
  min-height:100vh;min-height:100dvh;padding:12px;
}
.phone{
  width:100%;max-width:390px;height:844px;max-height:calc(100dvh - 24px);
  background:linear-gradient(170deg,var(--bg1),var(--bg2));
  border-radius:36px;overflow:hidden;position:relative;
  display:flex;flex-direction:column;
  box-shadow:0 20px 50px rgba(80,120,150,.28),0 0 0 10px #fff,0 0 0 11px #e7eef3;
  transition:background .5s;
}
.statusbar{
  height:44px;flex:0 0 44px;display:flex;align-items:center;
  justify-content:space-between;padding:0 22px;
  font-size:12px;font-weight:600;color:var(--tx);opacity:.8;
}

/* 主题切换 */
.themer{
  position:absolute;top:48px;right:14px;z-index:50;display:flex;gap:7px;
  background:rgba(255,255,255,.6);backdrop-filter:blur(8px);
  padding:5px 7px;border-radius:18px;box-shadow:0 3px 12px var(--sh);
}
.tdot{width:18px;height:18px;border-radius:50%;cursor:pointer;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.12);}
.tdot.sky{background:linear-gradient(135deg,#a1c4fd,#c2e9fb);}
.tdot.mint{background:linear-gradient(135deg,#a8edea,#cdeff0);}
.tdot.lavender{background:linear-gradient(135deg,#c2b8f5,#dcd6f7);}
.tdot.on{outline:2px solid var(--prid);outline-offset:1px;}

/* 内容区 */
.swrap{flex:1;overflow:hidden;position:relative;}
.scr{
  position:absolute;inset:0;overflow-y:auto;
  padding:6px 16px 90px;opacity:0;pointer-events:none;
  transform:translateY(8px);transition:opacity .32s,transform .32s;
}
.scr.on{opacity:1;pointer-events:auto;transform:translateY(0);}
.scr::-webkit-scrollbar{width:0;}

/* 通用 */
.tt{font-size:20px;font-weight:800;margin:6px 2px 2px;}
.st{font-size:12.5px;color:var(--txs);margin:0 2px 14px;}

/* ============ Tab1 · 我的衣橱 ============ */
.pcard{
  background:linear-gradient(140deg,var(--ga),var(--gb));
  border-radius:24px;padding:20px 18px;display:flex;align-items:center;gap:14px;
  box-shadow:0 10px 26px var(--sh);margin-bottom:14px;position:relative;overflow:hidden;
}
.pcard::after{content:"";position:absolute;right:-24px;top:-24px;width:100px;height:100px;border-radius:50%;background:rgba(255,255,255,.22);}
.avt{
  width:70px;height:70px;border-radius:50%;flex:0 0 70px;
  background:rgba(255,255,255,.85);
  display:flex;align-items:center;justify-content:center;
  font-size:36px;overflow:hidden;cursor:pointer;
  box-shadow:0 5px 14px rgba(0,0,0,.1);
  position:relative;
}
.avt img{width:100%;height:100%;object-fit:cover;border-radius:50%;}
.avt .avt-tip{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.18);color:#fff;font-size:10px;font-weight:700;border-radius:50%;opacity:0;transition:opacity .2s;}
.avt:active .avt-tip{opacity:1;}
.pinfo h2{font-size:18px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.1);}
.pinfo p{font-size:11.5px;color:rgba(255,255,255,.9);margin-top:3px;}
.ftags{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;}.ftags::-webkit-scrollbar{height:0;}
.chip{
  flex:0 0 auto;background:var(--card);color:var(--txs);
  border:1.5px solid var(--ln);padding:6px 13px;border-radius:15px;
  font-size:12.5px;font-weight:600;cursor:pointer;transition:all .2s;
}
.chip.on{background:var(--pri);color:#fff;border-color:var(--pri);box-shadow:0 3px 10px var(--sh);}

.cgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.cloth{
  background:var(--card);border-radius:16px;padding:9px;text-align:center;
  box-shadow:0 5px 14px var(--sh);cursor:pointer;transition:transform .15s;
  position:relative;
}
.cloth:active{transform:scale(.94);}
.cloth .thumb{
  width:100%;aspect-ratio:1;border-radius:10px;
  display:flex;align-items:center;justify-content:center;
  font-size:34px;overflow:hidden;margin-bottom:6px;
}
.cloth .thumb img{width:100%;height:100%;object-fit:cover;border-radius:10px;}
.cloth .name{font-size:11px;font-weight:600;color:var(--tx);}
.cloth .tag{font-size:9px;color:var(--txs);margin-top:1px;}
.cloth.add{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  border:2px dashed var(--ac);background:rgba(255,255,255,.5);box-shadow:none;
  color:var(--prid);min-height:132px;
}
.cloth.add .plus{font-size:28px;line-height:1;}
.cloth.add .t{font-size:11px;font-weight:700;margin-top:4px;}

/* ============ Tab2 · AI 穿搭 ============ */
.chat{display:flex;flex-direction:column;gap:10px;padding-bottom:6px;}
.bub{max-width:82%;padding:11px 14px;border-radius:17px;font-size:13.5px;line-height:1.5;box-shadow:0 3px 10px var(--sh);}
.bub.ai{align-self:flex-start;background:var(--card);color:var(--tx);border-bottom-left-radius:4px;}
.bub.me{align-self:flex-end;background:linear-gradient(135deg,var(--ga),var(--gb));color:#fff;border-bottom-right-radius:4px;}

.ocard{
  align-self:flex-start;width:88%;background:var(--card);
  border-radius:18px;overflow:hidden;box-shadow:0 7px 20px var(--sh);
}
.oimg{
  width:100%;aspect-ratio:4/5;
  background:linear-gradient(160deg,var(--ga),var(--gb));
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  color:#fff;gap:6px;position:relative;
}
.oimg .big{font-size:56px;}
.oimg .cap{font-size:11px;opacity:.92;}
.oinfo{padding:11px 13px;}
.oinfo .ti{font-size:13.5px;font-weight:700;}
.oinfo .its{font-size:11.5px;color:var(--txs);margin-top:4px;line-height:1.5;}
.oact{display:flex;gap:7px;margin-top:10px;}
.minib{
  flex:1;text-align:center;font-size:11.5px;font-weight:700;
  padding:7px;border-radius:11px;cursor:pointer;
  background:var(--bg1);color:var(--prid);border:1.5px solid var(--ln);
}
.minib.f{background:var(--pri);color:#fff;border-color:var(--pri);}

/* 加载 */
.ld{align-self:flex-start;display:flex;align-items:center;gap:9px;background:var(--card);padding:12px 16px;border-radius:16px;box-shadow:0 3px 10px var(--sh);font-size:12.5px;color:var(--txs);}
.ld .b{width:12px;height:12px;border-radius:50%;background:var(--pri);animation:br 1.3s ease-in-out infinite;}
@keyframes br{0%,100%{transform:scale(.5);opacity:.35;}50%{transform:scale(1.05);opacity:1;}}

.qr{display:flex;flex-wrap:wrap;gap:7px;margin:2px 0 8px;}
.q{font-size:12px;font-weight:600;background:rgba(255,255,255,.7);color:var(--prid);border:1.5px solid var(--ln);padding:6px 11px;border-radius:13px;cursor:pointer;}

.cibar{
  position:absolute;left:0;right:0;bottom:76px;
  padding:6px 14px;display:none;gap:8px;
}
.cibar input{
  flex:1;border:1.5px solid var(--ln);background:var(--card);
  border-radius:20px;padding:11px 15px;font-size:14px;outline:none;color:var(--tx);
  box-shadow:0 3px 12px var(--sh);
}
.cibar button{
  flex:0 0 42px;background:var(--pri);color:#fff;border:none;
  border-radius:50%;font-size:17px;cursor:pointer;box-shadow:0 3px 12px var(--sh);
}

/* ============ Tab3 · 社区 ============ */
.post{
  background:var(--card);border-radius:18px;padding:14px;margin-bottom:14px;
  box-shadow:0 5px 16px var(--sh);
}
.post .phead{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.post .pavt{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;background:var(--ga);}
.post .pname{font-size:13px;font-weight:700;}
.post .ptime{font-size:10.5px;color:var(--txs);}
.post .pbody{font-size:13px;line-height:1.6;margin-bottom:8px;}
.post .pimg{
  width:100%;aspect-ratio:4/5;border-radius:14px;overflow:hidden;
  background:linear-gradient(160deg,var(--ga),var(--gb));margin-bottom:8px;
  display:flex;align-items:center;justify-content:center;font-size:48px;color:#fff;
}
.post .pitems{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;}
.post .pi{
  font-size:10.5px;background:var(--bg1);color:var(--prid);
  padding:4px 8px;border-radius:9px;font-weight:600;
}
.post .pbtns{display:flex;gap:18px;}
.post .pbtn{
  font-size:12px;font-weight:600;color:var(--txs);cursor:pointer;
  display:flex;align-items:center;gap:4px;transition:color .2s;
  background:none;border:none;padding:0;
}
.post .pbtn.liked{color:#e88;}

/* 评论展开 */
.cms{padding-top:10px;margin-top:8px;border-top:1px solid var(--ln);display:none;}
.cms.show{display:block;}
.cm{font-size:12px;padding:5px 0;color:var(--tx);}
.cm .cname{font-weight:700;}
.cminp{display:flex;gap:6px;margin-top:6px;}
.cminp input{
  flex:1;border:1.5px solid var(--ln);border-radius:12px;
  padding:7px 10px;font-size:12px;outline:none;color:var(--tx);
}
.cminp button{
  background:var(--pri);color:#fff;border:none;border-radius:12px;
  padding:7px 13px;font-size:11px;font-weight:700;cursor:pointer;
}

/* ============ 底部导航 ============ */
.tabbar{
  position:absolute;left:0;right:0;bottom:0;height:70px;
  background:rgba(255,255,255,.82);backdrop-filter:blur(14px);
  border-top:1px solid var(--ln);display:flex;padding-bottom:4px;
}
.tab{
  flex:1;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:2px;cursor:pointer;
  color:var(--txs);font-size:10.5px;font-weight:600;transition:color .2s;
}
.tab .ic{font-size:20px;transition:transform .2s;}
.tab.on{color:var(--prid);}.tab.on .ic{transform:translateY(-2px) scale(1.1);}

/* ============ 登录页 ============ */
.wc{
  position:absolute;inset:0;z-index:100;
  background:linear-gradient(165deg,var(--ga),var(--gb));
  display:flex;flex-direction:column;align-items:center;
  justify-content:center;text-align:center;padding:40px 30px;
  transition:opacity .5s,transform .5s;
}
.wc.hide{opacity:0;transform:scale(1.03);pointer-events:none;}
.wc .logo{font-size:68px;margin-bottom:6px;}
.wc h1{font-size:28px;color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.12);letter-spacing:2px;}
.wc .slo{font-size:13px;color:rgba(255,255,255,.93);margin:8px 0 32px;}
.wc input{width:100%;border:none;border-radius:16px;padding:14px 16px;font-size:15px;text-align:center;letter-spacing:2px;outline:none;color:var(--tx);box-shadow:0 6px 20px rgba(0,0,0,.12);}
.wc .ebtn{width:100%;margin-top:12px;background:#fff;color:var(--prid);border:none;border-radius:16px;padding:14px;font-size:15px;font-weight:800;cursor:pointer;box-shadow:0 6px 20px rgba(0,0,0,.14);}
.wc .hint{font-size:11.5px;color:rgba(255,255,255,.82);margin-top:14px;}

/* ============ 弹窗 ============ */
.ov{
  position:absolute;inset:0;z-index:80;
  background:rgba(0,0,0,.35);display:none;
  align-items:flex-end;justify-content:center;
}
.ov.show{display:flex;}
.mo{
  width:100%;max-width:390px;background:var(--card);border-radius:24px 24px 0 0;
  padding:20px 18px 32px;max-height:80vh;overflow-y:auto;
  animation:su .3s ease;
  display:flex;flex-direction:column;
}
.mo .mo-scroll{flex:1;overflow-y:auto;}
.mo .mo-foot{flex:0 0 auto;padding-top:10px;position:sticky;bottom:0;background:var(--card);}
@keyframes su{from{transform:translateY(100%);}to{transform:translateY(0);}}
.mo h3{font-size:17px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;}
.mo h3 .cls{font-size:22px;cursor:pointer;color:var(--txs);background:none;border:none;padding:0 4px;}
.mo .row{display:flex;flex-direction:column;gap:4px;margin-bottom:11px;}
.mo label{font-size:12px;font-weight:700;color:var(--txs);}
.mo input,.mo select,.mo textarea{
  border:1.5px solid var(--ln);border-radius:12px;padding:10px 12px;
  font-size:14px;outline:none;color:var(--tx);background:var(--bg1);
  width:100%;font-family:inherit;
}
.mo textarea{min-height:60px;resize:vertical;}
.mo .imgup{
  width:100%;height:120px;border:2px dashed var(--ac);border-radius:14px;
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  font-size:14px;color:var(--prid);background:var(--bg1);overflow:hidden;
}
.mo .imgup img{width:100%;height:100%;object-fit:cover;border-radius:12px;}
.mo .saveb{
  width:100%;margin-top:10px;background:var(--pri);color:#fff;
  border:none;border-radius:14px;padding:13px;font-size:15px;font-weight:800;cursor:pointer;
}

/* Toast */
.toast{
  position:absolute;left:50%;bottom:100px;transform:translateX(-50%) translateY(10px);
  background:rgba(45,74,94,.92);color:#fff;font-size:12.5px;
  padding:9px 16px;border-radius:12px;opacity:0;pointer-events:none;
  transition:all .3s;z-index:90;white-space:nowrap;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* 响应式: 宽屏居中缩小 */
@media(min-width:600px){
  body{padding:24px;}
  .phone{max-width:390px;}
}
</style>
</head>
<body>

<div class="phone" data-theme="sky" id="phone">

  <!-- 登录页 -->
  <div class="wc" id="wc">
    <div class="logo">🌤️</div><h1>云衣橱</h1>
    <div class="slo">把每一天的好心情，穿在身上</div>
    <input id="invInp" placeholder="输入邀请码" value="YUNYI2026"/>
    <button class="ebtn" onclick="enterApp()">进入云衣橱</button>
    <div class="hint">小圈子内测中 · 邀请码已预填 ✨</div>
  </div>

  <!-- 状态条 -->
  <div class="statusbar"><span>9:41</span><span>云衣橱</span><span>📶 🔋</span></div>

  <!-- 主题切换 -->
  <div class="themer">
    <div class="tdot sky on" onclick="setTheme('sky',this)"></div>
    <div class="tdot mint" onclick="setTheme('mint',this)"></div>
    <div class="tdot lavender" onclick="setTheme('lavender',this)"></div>
  </div>

  <!-- 内容区 -->
  <div class="swrap">

    <!-- ===== Tab1 我的衣橱 ===== -->
    <section class="scr on" id="s1">
      <div class="pcard">
        <div class="avt" id="avatar" onclick="uploadAvatar()">
          <span id="avtEmoji">🧍‍♀️</span>
          <img id="avtImg" style="display:none"/>
          <div class="avt-tip">更换形象</div>
        </div>
        <div class="pinfo">
          <h2 id="uname" contenteditable="true">小晴</h2>
          <p>今天也要美美哒 ☁️</p>
          <span class="chip" style="display:inline-block;margin-top:6px;color:var(--prid);background:rgba(255,255,255,.9);">
            衣橱 <span id="clothCount">0</span> 件单品
          </span>
          <span class="chip" style="display:inline-block;margin-top:6px;margin-left:4px;color:var(--txs);background:rgba(255,255,255,.6);cursor:pointer;font-size:10px;" onclick="resetAllData()" title="重新载入演示数据">🔧 重置</span>
        </div>
      </div>

      <div class="ftags" id="ftags">
        <div class="chip on" onclick="renderCloset('全部',this)">全部</div>
        <div class="chip" onclick="renderCloset('上衣',this)">上衣</div>
        <div class="chip" onclick="renderCloset('下装',this)">下装</div>
        <div class="chip" onclick="renderCloset('外套',this)">外套</div>
        <div class="chip" onclick="renderCloset('鞋',this)">鞋</div>
        <div class="chip" onclick="renderCloset('配饰',this)">配饰</div>
      </div>

      <div class="cgrid" id="cgrid"></div>
    </section>

    <!-- ===== Tab2 AI 穿搭 ===== -->
    <section class="scr" id="s2">
      <h1 class="tt">AI 穿搭师 ✨</h1>
      <p class="st">用你自己的话，让我从你的衣橱里搭配一套</p>
      <div class="qr">
        <div class="q" onclick="askAI('明天约会，帮我搭温柔一点的')">💕 约会温柔风</div>
        <div class="q" onclick="askAI('下雨天通勤，要清爽好走')">🌧️ 雨天通勤</div>
        <div class="q" onclick="askAI('周末出去玩，活泼一点')">🎈 周末出游</div>
        <div class="q" onclick="askAI('参加朋友婚礼，要精致好看')">💒 参加婚礼</div>
      </div>
      <div class="chat" id="chat">
        <div class="bub ai">嗨，我是你的 AI 穿搭师 ☁️<br/>告诉我今天要去什么场合、想要什么风格，我从你的衣橱里帮你搭配～</div>
      </div>
    </section>

    <!-- ===== Tab3 社区 ===== -->
    <section class="scr" id="s3">
      <h1 class="tt" style="margin-bottom:2px;">穿搭广场 🌷</h1>
      <p class="st">分享你的穿搭，一起变美</p>
      <div id="postFeed"></div>
    </section>
  </div>

  <!-- 聊天输入（Tab2） -->
  <div class="cibar" id="cibar">
    <input id="ci" placeholder="和 AI 说说今天想穿什么…" onkeydown="if(event.key==='Enter')sendMsg()"/>
    <button onclick="sendMsg()">↑</button>
  </div>

  <!-- 底部导航 -->
  <nav class="tabbar">
    <div class="tab on" data-t="s1" onclick="switchTab('s1',this)"><span class="ic">👗</span><span>我的衣橱</span></div>
    <div class="tab" data-t="s2" onclick="switchTab('s2',this)"><span class="ic">✨</span><span>AI 穿搭</span></div>
    <div class="tab" data-t="s3" onclick="switchTab('s3',this)"><span class="ic">🌷</span><span>社区</span></div>
  </nav>

  <!-- ===== 弹窗：添加衣服 ===== -->
  <div class="ov" id="ovCloth">
    <div class="mo">
      <div class="mo-scroll">
        <h3>➕ 添加单品 <button class="cls" onclick="closeOv('ovCloth')">✕</button></h3>
        <div class="imgup" onclick="document.getElementById('clothImgInp').click()" id="clothImgPrev">📸 点击上传衣服照片</div>
        <input type="file" id="clothImgInp" accept="image/*" capture="environment" onchange="previewClothImg(this)" style="display:none"/>

// ---- 数据存储 ----
var APP_VERSION='v4.0';
const S={
  get ver(){return localStorage.getItem('dataVersion')||'';},
  set ver(v){localStorage.setItem('dataVersion',v);},
  get avt(){return localStorage.getItem('avtImg')||'';},
  set avt(v){localStorage.setItem('avtImg',v);},
  get uname(){return localStorage.getItem('uname')||'小晴';},
  set uname(v){localStorage.setItem('uname',v);},
  get clothes(){try{return JSON.parse(localStorage.getItem('clothes')||'[]');}catch(e){return[];}},

let currentDetailId=null;

// ===================== AI 图像生成 =====================
// 使用 Pollinations.ai 免费 API（无需 API Key）
function aiImage(prompt,w,h){
  w=w||512;h=h||640;
  return 'https://image.pollinations.ai/prompt/'+encodeURIComponent(prompt)+'?width='+w+'&height='+h+'&nologo=true';
}

// AI 生成穿搭效果图 — 用真实衣服属性生成详细 prompt
function outfitImagePrompt(items, clothesList){
  var desc='';
  for(var i=0;i<clothesList.length;i++){
    var c=clothesList[i];
    desc+=c.color+c.name+', ';
  }
  return 'fashion outfit flat lay photography, featuring ' + desc + 'arranged beautifully on a soft pastel background, minimalist korean fashion style, soft natural lighting, clean aesthetic, high quality, gentle colors';
}

// AI 生成治愈风穿搭场景图 — 用用户形象+具体衣服描述
function outfitScenePrompt(items, clothesList, occasion, style){
  var clothingDesc='';
  for(var i=0;i<clothesList.length;i++){
    var c=clothesList[i];
    clothingDesc+=c.color+' '+c.name+' ('+c.cat+'), ';
  }
  var sceneDesc=occasion||'casual daily life';
  var styleDesc=style||'soft and gentle';
  return 'A beautiful young woman wearing ' + clothingDesc + 'full body portrait, ' + styleDesc + ' style, ' + sceneDesc + ' setting, studio ghibli inspired animation style, soft pastel colors, dreamy atmosphere, gentle lighting, kawaii aesthetic, high quality fashion illustration, detailed clothing rendering';
}

// ===================== 初始化 =====================
(function init(){
  var oldVer=S.ver;
  if(oldVer!==APP_VERSION){
    // 版本升级 — 清除所有旧数据，重新播种
    var savedAvt=S.avt;
    var savedName=S.uname;
    // 彻底清空
    localStorage.clear();
    // 恢复版本号
    S.ver=APP_VERSION;
    // 播种
    S.clothes=DEMO_CLOTHES;
    S.posts=DEMO_POSTS;
    // 恢复用户数据
    if(savedAvt)S.avt=savedAvt;
    if(savedName&&savedName!=='小晴')S.uname=savedName;
    toast('✨ 已更新到 '+APP_VERSION+'，预置 12 件衣服 + 6 条社区帖子');
  }else{
    // 正常启动：数据为空时才播种
    if(S.clothes.length===0){S.clothes=DEMO_CLOTHES;}
    if(S.posts.length===0){S.posts=DEMO_POSTS;}
  }

  loadAvatar();
  document.getElementById('uname').textContent=S.uname;
  renderCloset('全部',document.querySelector('#ftags .chip'));
  renderCommunity();
  updateDebug();
  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('./sw.js').then(function(reg){
      reg.onupdatefound=function(){
        var newSW=reg.installing;
        if(newSW){
          newSW.onstatechange=function(){
            if(newSW.state==='installed'&&navigator.serviceWorker.controller){
              toast('有新版本可用，刷新页面即可更新 🌤️');
            }
          };
        }
      };
    }).catch(function(){});
  }
})();

// ---- 手动重置演示数据 ----
function resetAllData(){
  if(!confirm('确定要重置所有数据吗？这将清除你的头像和自定义衣服，恢复到初始演示状态。'))return;
  localStorage.clear();
  S.ver=APP_VERSION;
  S.clothes=DEMO_CLOTHES;
  S.posts=DEMO_POSTS;
  loadAvatar();
  document.getElementById('uname').textContent='小晴';
  currentFilter='全部';
  var chips=document.querySelectorAll('#ftags .chip');
  for(var i=0;i<chips.length;i++){chips[i].classList.remove('on');}
  var firstChip=document.querySelector('#ftags .chip');
  if(firstChip)firstChip.classList.add('on');
  renderCloset('全部');
  renderCommunity();
  updateDebug();

// ---- 头像（上传 + AI 生成） ----
function loadAvatar(){
  const ae=document.getElementById('avtEmoji'),ai=document.getElementById('avtImg');
  if(S.avt){ae.style.display='none';ai.style.display='block';ai.src=S.avt;}
  else{ae.style.display='block';ai.style.display='none';}
}
function uploadAvatar(){document.getElementById('avtInp').click();}
function onAvatarPicked(inp){
  if(!inp.files[0])return;
  const r=new FileReader();
  r.onload=function(){
    S.avt=r.result;loadAvatar();
    toast('形象已更新！正在 AI 生成虚拟形象… 🎨');
    // AI 生成 2D 虚拟形象
    const aiUrl=aiImage('cute 2D anime style avatar portrait of a young asian woman, soft pastel colors, clean simple illustration, full body fashion illustration, gentle smile, studio ghibli inspired, kawaii style, white background',400,600);
    const img=new Image();
    img.onload=function(){S.avt=aiUrl;loadAvatar();toast('AI 虚拟形象已生成 ✨');};
    img.onerror=function(){toast('AI 生成中，当前使用原图。稍后可在头像区查看');};
    img.src=aiUrl;
  };
  r.readAsDataURL(inp.files[0]);
  inp.value='';
}

// ---- 衣橱渲染 ----
var currentFilter='全部';
function renderCloset(filter,el){
  if(el){
    var chips=document.querySelectorAll('#ftags .chip');
    for(var i=0;i<chips.length;i++){chips[i].classList.remove('on');}
    el.classList.add('on');
  }
  if(filter)currentFilter=filter;
  filter=currentFilter;
  var g=document.getElementById('cgrid');
  if(!g){updateDebug();return;}
  var list=S.clothes;
  if(filter!=='全部'){
    list=[];
    var all=S.clothes;
    for(var j=0;j<all.length;j++){
      if(all[j].cat===filter||all[j].category===filter){list.push(all[j]);}
    }
  }
  var html='';
  for(var k=0;k<list.length;k++){
    var c=list[k];
    var imgHtml=c.image?'<img src="'+c.image+'" />':'<span>'+c.emoji+'</span>';
    html+='<div class="cloth" onclick="openDetail('+c.id+')">'
      +'<div class="thumb" style="background:'+(c.grad||'linear-gradient(135deg,#eaf6ff,#c2e9fb)')+'">'+imgHtml+'</div>'
      +'<div class="name">'+c.name+'</div>'
      +'<div class="tag">'+(c.cat||c.category||'')+' · '+(c.color||'')+'</div></div>';
  }
  html+='<div class="cloth add" onclick="openAddCloth()"><div class="plus">＋</div><div class="t">添加单品</div></div>';
  g.innerHTML=html;
  var cc=document.getElementById('clothCount');
  if(cc)cc.textContent=S.clothes.length;
}

// ---- 添加衣服弹窗 ----
let clothEditImg=null;
function openAddCloth(){
  document.getElementById('clothImgPrev').innerHTML='📸 点击上传衣服照片';
  document.getElementById('cfName').value='';
  document.getElementById('cfCat').value='上衣';
  document.getElementById('cfColor').value='';
  document.getElementById('cfSize').value='';
  document.getElementById('cfNote').value='';
  clothEditImg=null;
  showOv('ovCloth');
}
function previewClothImg(inp){
  if(!inp.files[0])return;
  var r=new FileReader();
  r.onload=function(){clothEditImg=r.result;document.getElementById('clothImgPrev').innerHTML='<img src="'+r.result+'"/>';};
  r.readAsDataURL(inp.files[0]);
  inp.value='';
}
function saveCloth(){
  var name=document.getElementById('cfName').value.trim();
  if(!name){toast('请给这件衣服起个名字～');return;}
  var cat=document.getElementById('cfCat').value;
  var color=document.getElementById('cfColor').value.trim();
  var size=document.getElementById('cfSize').value.trim();
  var note=document.getElementById('cfNote').value.trim();
  var cloth={
    id:Date.now(),name:name,cat:cat,category:cat,color:color,size:size,note:note,
    image:clothEditImg||'',
    emoji:'👗',
    grad:'linear-gradient(135deg,'+varColor(cat)+')',
    createdAt:new Date().toISOString()
  };
  var cs=S.clothes;cs.push(cloth);S.clothes=cs;
  closeOv('ovCloth');
  renderCloset();
  toast('已加入衣橱 💙');
}

function varColor(cat){
  var m={上衣:'#fbc2eb,#a6c1ee',下装:'#a1c4fd,#d4e7fb',外套:'#f6d365,#fda085',鞋:'#fdfbfb,#e2e8ec',配饰:'#a8edea,#cdeff0'};
  return m[cat]||'#eaf6ff,#c2e9fb';
}

// ---- 衣服详情 ----
function openDetail(id){
  var c=S.clothes.find(function(c){return c.id===id;});if(!c)return;
  currentDetailId=c.id;
  document.getElementById('dName').textContent=c.name;
  document.getElementById('dImg').innerHTML=c.image?'<img src="'+c.image+'" style="max-width:100%;max-height:200px;border-radius:14px;object-fit:cover"/>':(c.emoji||'👗');
  document.getElementById('dCat').value=c.cat||c.category||'';
  document.getElementById('dColor').value=c.color||'';
  document.getElementById('dSize').value=c.size||'';
  document.getElementById('dNote').textContent=c.note||'暂无备注';
  showOv('ovDetail');
}
function deleteCloth(id){
  if(!confirm('确定要移除这件衣服吗？'))return;
  var cs=S.clothes.filter(function(c){return c.id!==id;});S.clothes=cs;currentDetailId=null;
  closeOv('ovDetail');renderCloset();
  toast('已移除');
}

// ---- 弹窗通用 ----
function showOv(id){document.getElementById(id).classList.add('show');}
function closeOv(id){document.getElementById(id).classList.remove('show');}

// ---- Tab 切换 ----
function switchTab(id,el){
  document.querySelectorAll('.scr').forEach(function(s){s.classList.remove('on');});
  document.getElementById(id).classList.add('on');
  document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('on');});
  el.classList.add('on');
  document.getElementById('cibar').style.display=(id==='s2')?'flex':'none';
  // 切到社区时重新渲染
  if(id==='s3')renderCommunity();
}

// ===================== AI 穿搭 =====================
var lastUserRequest='';
var outfitIdx=0;

function askAI(text){lastUserRequest=text;switchToAITab();addBub(text,'me');think(text);}
function sendMsg(){
  var inp=document.getElementById('ci');var v=inp.value.trim();if(!v)return;
  lastUserRequest=v;addBub(v,'me');inp.value='';think(v);
}
function addBub(text,who){
  var d=document.createElement('div');d.className='bub '+who;d.textContent=text;
  document.getElementById('chat').appendChild(d);scrollChat();
}

// ---- 解析用户的穿搭需求 ----
function analyzeRequest(text){
  var result={occasion:'日常出行',style:'温柔清新',mood:''};
  var t=text||'';
  if(t.indexOf('约会')>=0||t.indexOf('约会')>=0){result.occasion='浪漫约会';result.style='温柔甜美';}
  else if(t.indexOf('通勤')>=0||t.indexOf('上班')>=0||t.indexOf('面试')>=0){result.occasion='通勤办公';result.style='简约干练';}
  else if(t.indexOf('出游')>=0||t.indexOf('出去玩')>=0||t.indexOf('周末')>=0){result.occasion='周末出游';result.style='活泼开朗';}
  else if(t.indexOf('婚礼')>=0||t.indexOf('宴会')>=0||t.indexOf('正式')>=0){result.occasion='正式场合';result.style='精致优雅';}
  else if(t.indexOf('运动')>=0||t.indexOf('健身')>=0){result.occasion='运动休闲';result.style='活力运动';}
  else if(t.indexOf('聚会')>=0||t.indexOf('闺蜜')>=0||t.indexOf('朋友')>=0){result.occasion='朋友聚会';result.style='时尚气质';}
  else if(t.indexOf('温柔')>=0){result.style='温柔清新';}
  else if(t.indexOf('清爽')>=0||t.indexOf('干净')>=0){result.style='清爽简约';}
  else if(t.indexOf('活泼')>=0||t.indexOf('可爱')>=0){result.style='活泼可爱';}
  else if(t.indexOf('精致')>=0||t.indexOf('高级')>=0){result.style='精致高级';}
  else if(t.indexOf('治愈')>=0||t.indexOf('舒服')>=0){result.style='治愈舒适';}
  else if(t.indexOf('气质')>=0||t.indexOf('优雅')>=0){result.style='优雅气质';}
  return result;
}

// ---- AI 智能选衣 + 生成穿搭 ----
function think(userText){
  var area=document.getElementById('chat');
  var ld=document.createElement('div');ld.className='ld';
  ld.innerHTML='<span class="b"></span>AI 正在分析你的需求，从衣橱中精选搭配…';
  area.appendChild(ld);scrollChat();

  setTimeout(function(){
    var cs=S.clothes;
    if(cs.length===0){
      ld.remove();
      addBub('你的衣橱还是空的哦～先去「我的衣橱」添加几件衣服吧 ☁️','ai');
      scrollChat();
      return;
    }

    // 分析用户需求
    var req=analyzeRequest(userText||lastUserRequest);

    // 按分类分组
    var tops=[],bottoms=[],outers=[],shoes=[],accs=[];
    for(var i=0;i<cs.length;i++){
      var c=cs[i];
      if(c.cat==='上衣'||c.category==='上衣')tops.push(c);
      else if(c.cat==='下装'||c.category==='下装')bottoms.push(c);
      else if(c.cat==='外套'||c.category==='外套')outers.push(c);
      else if(c.cat==='鞋'||c.category==='鞋')shoes.push(c);
      else accs.push(c);
    }

    // 智能选择：优先配色协调
    var pick=[];
    // 1. 选上衣
    if(tops.length>0){
      tops.sort(function(){return Math.random()-0.5;});
      pick.push(tops[0]);
    }
    // 2. 选下装（尝试配色协调）
    if(bottoms.length>0){
      bottoms.sort(function(){return Math.random()-0.5;});
      pick.push(bottoms[0]);
    }
    // 3. 选鞋
    if(shoes.length>0){
      shoes.sort(function(){return Math.random()-0.5;});
      pick.push(shoes[0]);
    }
    // 4. 偶尔加外套
    if(outers.length>0&&Math.random()>0.5){
      outers.sort(function(){return Math.random()-0.5;});
      pick.push(outers[0]);
    }
    // 5. 偶尔加配饰
    if(accs.length>0&&Math.random()>0.6){
      accs.sort(function(){return Math.random()-0.5;});
      pick.push(accs[0]);
    }

    // 保证不超过5件
    if(pick.length>5)pick=pick.slice(0,5);

    // 生成标题和描述
    var itemsText='';
    for(var j=0;j<pick.length;j++){itemsText+=pick[j].name;if(j<pick.length-1)itemsText+=' + ';}
    if(!itemsText)itemsText='先去衣橱添加几件衣服吧 ☁️';

    var title='✨ '+req.style+' · '+req.occasion;
    var occasion=req.occasion;
    var style=req.style;

    // 生成 AI 穿搭图片 prompt（使用真实衣服属性）
    var aiPrompt=outfitScenePrompt(itemsText, pick, occasion, style);
    var imgUrl=aiImage(aiPrompt,512,640);
    var flatPrompt=outfitImagePrompt(itemsText, pick);
    var flatUrl=aiImage(flatPrompt,512,400);

    // 构建展示卡片
    var pickEmojis='';
    for(var e=0;e<pick.length;e++){pickEmojis+=pick[e].emoji+' ';}

    ld.remove();
    var card=document.createElement('div');card.className='ocard';

    // 加载中占位
    var loadingHTML='<div style="position:absolute;inset:0;background:linear-gradient(160deg,var(--ga),var(--gb));display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;">'
      +'<div class="big">'+pickEmojis+'</div>'
      +'<div class="cap">✨ AI 正在生成穿搭效果图…</div>'
      +'</div>';

    card.innerHTML=''
      +'<div class="oimg" style="aspect-ratio:4/5;position:relative;">'
      +'<img src="'+flatUrl+'" style="width:100%;height:100%;object-fit:cover;position:absolute;inset:0;" onerror="this.style.display=\'none\'" alt=""/>'
      +loadingHTML
      +'</div>'
      +'<div class="oinfo">'
      +'<div class="ti">'+title+'</div>'
      +'<div class="its">'+itemsText+'</div>'
      +'<div class="oact">'
      +'<div class="minib" onclick="think(lastUserRequest)">🔄 换一套</div>'
      +'<div class="minib f" onclick="shareOutfit(\''+encodeURIComponent(title)+'\',\''+encodeURIComponent(itemsText)+'\',\''+encodeURIComponent(aiPrompt)+'\')">💾 保存并分享</div>'
      +'</div></div>';
    area.appendChild(card);
    scrollChat();

    // 异步加载 AI 场景图
    var testImg=new Image();
    testImg.onload=function(){
      var oimg=card.querySelector('.oimg');
      oimg.style.backgroundImage='url('+imgUrl+')';
      oimg.style.backgroundSize='cover';
      oimg.style.backgroundPosition='center';
      // 隐藏加载层
      var overlay=oimg.querySelector('div');
      if(overlay)overlay.style.display='none';
      var flatImg=oimg.querySelector('img');
      if(flatImg)flatImg.style.display='none';
    };
    testImg.onerror=function(){
      var overlay=card.querySelector('.oimg div');
      if(overlay)overlay.innerHTML='<div class="big">'+pickEmojis+'</div><div class="cap">AI 穿搭组合（点击换一套）</div>';
    };
    testImg.src=imgUrl;

    outfitIdx++;
  },1800);
}
function scrollChat(){var s=document.getElementById('s2');setTimeout(function(){s.scrollTop=s.scrollHeight;},50);}
function switchToAITab(){
  document.querySelectorAll('.scr').forEach(function(s){s.classList.remove('on');});
  document.getElementById('s2').classList.add('on');
  document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('on');});
  document.querySelector('.tab[data-t="s2"]').classList.add('on');
  document.getElementById('cibar').style.display='flex';
}

// ---- 保存搭配并分享到社区 ----
function shareOutfit(titleEnc, itemsEnc, promptEnc){
  var title=decodeURIComponent(titleEnc);
  var items=decodeURIComponent(itemsEnc);
  var prompt=decodeURIComponent(promptEnc||'');
  // 生成配图 URL
  var imgPrompt=prompt||outfitScenePrompt(items,'');
  var imgUrl=aiImage(imgPrompt,512,640);
  var post={
    id:Date.now(),uname:S.uname,avatar:S.avt,time:new Date().toLocaleString('zh-CN'),
    title:title,items:items,imagePrompt:imgPrompt,imageUrl:imgUrl,
    likes:[],comments:[],showComments:false
  };
  var ps=S.posts;ps.unshift(post);S.posts=ps;
  renderCommunity();toast('已分享到穿搭广场 🌷');
}

// ===================== 社区渲染 =====================
function renderCommunity(){
  var feed=document.getElementById('postFeed');
  if(!feed)return;
  var ps=S.posts;
  // 为空时恢复预置数据
  if(!ps||ps.length===0){S.posts=DEMO_POSTS;ps=S.posts;}

  feed.innerHTML=ps.map(function(p,i){
    var avtHtml=p.avatar?'<img src="'+p.avatar+'" style="width:100%;height:100%;object-fit:cover;border-radius:50%"/>':'🧍‍♀️';
    var itemsArr=p.items.split(' + ');
    var likeCount=p.likes.length;
    var commentCount=p.comments.length;
    var isLiked=p.likes.indexOf('me')>=0;

    // 为每条帖子生成 AI 穿搭效果图（缓存友好的 URL）
    var postImg=p.imageUrl||aiImage(outfitScenePrompt(p.items,''),512,640);

    return '<div class="post">'
      +'<div class="phead"><div class="pavt">'+avtHtml+'</div><div><div class="pname">'+p.uname+'</div><div class="ptime">'+p.time+'</div></div></div>'
      +'<div class="pbody">'+p.title+'</div>'
      +'<div class="pimg" style="background:linear-gradient(160deg,var(--ga),var(--gb))">'
      +'<img src="'+postImg+'" style="width:100%;height:100%;object-fit:cover;border-radius:14px" onerror="this.style.display=\'none\';this.parentElement.innerHTML=\'<span style=font-size:50px>👗</span>\'" alt="穿搭效果图"/>'
      +'</div>'
      +'<div class="pitems">'+itemsArr.map(function(it){return '<span class="pi">'+it+'</span>';}).join('')+'</div>'
      +'<div class="pbtns">'
      +'<button class="pbtn '+(isLiked?'liked':'')+'" onclick="toggleLikePost('+i+')">'+(isLiked?'❤️':'🤍')+' <span>'+likeCount+'</span></button>'
      +'<button class="pbtn" onclick="toggleCollectPost('+i+')">⭐ 收藏</button>'
      +'<button class="pbtn" onclick="toggleCommentsPost('+i+')">💬 评论 '+commentCount+'</button>'
      +'</div>'
      +'<div class="cms '+(p.showComments?'show':'')+'" id="cms'+i+'">'
      +p.comments.map(function(c){return '<div class="cm"><span class="cname">'+c.name+'：</span>'+c.text+'</div>';}).join('')
      +'<div class="cminp"><input id="cmInp'+i+'" placeholder="写下评论…" onkeydown="if(event.key===\'Enter\')addCommentPost('+i+')"/><button onclick="addCommentPost('+i+')">发送</button></div>'
      +'</div></div>';
  }).join('');
}

// 社区操作函数（用 -Post 后缀区分，避免和旧版冲突）
function toggleLikePost(i){
  var ps=S.posts;var p=ps[i];if(!p)return;
  var idx=p.likes.indexOf('me');
  if(idx>=0)p.likes.splice(idx,1);else p.likes.push('me');
  S.posts=ps;renderCommunity();
}
function toggleCollectPost(i){
  var ps=S.posts;if(!ps[i])return;
  ps[i].collected=!ps[i].collected;S.posts=ps;
  toast(ps[i].collected?'已收藏 ⭐':'已取消收藏');
  renderCommunity();
}
function toggleCommentsPost(i){
  var ps=S.posts;if(!ps[i])return;
  ps[i].showComments=!ps[i].showComments;S.posts=ps;renderCommunity();
}
function addCommentPost(i){
  var inp=document.getElementById('cmInp'+i);var v=inp.value.trim();if(!v)return;
  var ps=S.posts;if(!ps[i])return;
  ps[i].comments.push({name:'我',text:v});ps[i].showComments=true;S.posts=ps;
  renderCommunity();toast('评论已发送 💬');
}

function setTheme(name,el){
  document.getElementById('phone').setAttribute('data-theme',name);
  document.querySelectorAll('.tdot').forEach(function(d){d.classList.remove('on');});el.classList.add('on');
}

// ---- 登录 ----
function enterApp(){
  var v=document.getElementById('invInp').value.trim();if(!v){toast('请输入邀请码～');return;}
  document.getElementById('wc').classList.add('hide');
}

// ---- Toast ----
var ttimer;
function toast(msg){
  var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');
  clearTimeout(ttimer);ttimer=setTimeout(function(){t.classList.remove('show');},2200);
  updateDebug();
}

// ---- 调试面板 ----
function updateDebug(){
  var db=document.getElementById('debugBar');
  if(!db)return;
  try{
    var cs=JSON.parse(localStorage.getItem('clothes')||'[]');
    var ps=JSON.parse(localStorage.getItem('posts')||'[]');
    var keys=Object.keys(localStorage);
    document.getElementById('dbVer').textContent='ver:'+APP_VERSION+'/'+(localStorage.getItem('dataVersion')||'none');
    document.getElementById('dbClothes').textContent='衣服:'+cs.length+'件';
    document.getElementById('dbPosts').textContent='帖子:'+ps.length+'条';
    document.getElementById('dbLS').textContent='LS键:'+keys.length+'('+keys.join(',').slice(0,50)+')';
  }catch(e){
    db.textContent='DEBUG ERROR: '+e.message;
  }
}
function toggleDebug(){
  var db=document.getElementById('debugBar');
  if(!db)return;
  db.style.display=db.style.display==='flex'?'none':'flex';
}
